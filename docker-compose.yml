# 로컬(또는 넉넉한 서버)에서: cp .env.example .env (값 채우기) → docker compose up -d --build
# 데이터는 ./data 에 생긴다. 이전할 때는 ./data 와 .env 만 옮기면 된다.
services:
  app:
    build: .
    image: nakamura:local
    container_name: nakamura
    restart: unless-stopped
    env_file: .env
    environment:
      DATA_DIR: /data
      HOST: 0.0.0.0
      PORT: 8081
    ports:
      - "127.0.0.1:8081:8081"     # 공개는 리버스 프록시 · tailscale serve · cloudflared 로
    volumes:
      - ./data:/data
